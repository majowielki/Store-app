# gitleaks configuration (the "Secrets scan" job in CI and `gitleaks git .` locally).
# The default rules apply; only the fixtures below are excluded. They are the signing and
# internal keys the test projects hand to the hosts under test, the throw-away values the
# end-to-end workflow starts docker compose with and the placeholders the OpenAPI export
# gives a host that never connects to anything. None of them protects anything.

title = "store-app"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and placeholders that look like keys"
paths = [
  '''^Tests/Integration/TestSupport/TestTokens\.cs$''',
  '''^Tests/Unit/IdentityService/AuthServiceTests\.cs$''',
  '''^Tests/Unit/Shared/InternalApiKeyAuthenticationTests\.cs$''',
  '''^\.github/workflows/e2e\.yml$''',
  '''^Scripts/Export-OpenApi\.ps1$''',
]
