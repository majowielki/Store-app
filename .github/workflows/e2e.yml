name: End-to-end

# The Playwright scenarios (UI/store-app.UI/e2e) against the whole stack from docker compose:
# nightly, on demand, and whenever a release is being prepared.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright against docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Throw-away secrets for the stack under test; nothing here leaves the runner
      JWT_SECRET_KEY: e2e-only-jwt-secret-key-that-is-long-enough-0123456789
      INTERNAL_API_KEY: e2e-only-internal-api-key-0123456789abcdef
      TRUE_ADMIN_PASSWORD: E2e-Admin-Pass-1!
      # Every scenario signs in on its own; the production limit (10 a minute) would stop them
      AUTH_CREDENTIAL_LIMIT: 1000
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 600
      - name: Show the stack
        if: always()
        run: docker compose ps
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI/store-app.UI/package-lock.json
      - run: npm ci
        working-directory: UI/store-app.UI
      - run: npx playwright install --with-deps chromium
        working-directory: UI/store-app.UI
      - name: Run the scenarios
        working-directory: UI/store-app.UI
        env:
          E2E_BASE_URL: http://localhost:8081
          E2E_ADMIN_PASSWORD: ${{ env.TRUE_ADMIN_PASSWORD }}
        run: npx playwright test
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: UI/store-app.UI/playwright-report
          retention-days: 14
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
