name: End-to-end

# The whole stack from docker compose, tested from the outside: the Playwright scenarios
# (UI/store-app.UI/e2e) and Lighthouse CI with the shop's performance, accessibility and SEO
# budget (UI/store-app.UI/lighthouserc.cjs). On every pull request to main, so a change that breaks
# a purchase does not get in; nightly, on demand, and whenever a release is being prepared.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Throw-away secrets for the stack under test; nothing here leaves the runner
env:
  POSTGRES_PASSWORD: e2e-only-postgres-password
  RABBITMQ_PASSWORD: e2e-only-rabbitmq-password
  JWT_SECRET_KEY: e2e-only-jwt-secret-key-that-is-long-enough-0123456789
  INTERNAL_API_KEY: e2e-only-internal-api-key-0123456789abcdef
  PAYMENT_WEBHOOK_SECRET: e2e-only-payment-webhook-secret-0123456789abcdef
  TRUE_ADMIN_PASSWORD: E2e-Admin-Pass-1!
  # The scenarios sign in as the demo accounts too
  DEMO_ENABLED: "true"
  # Every scenario signs in on its own and every page load renews the session; the production
  # limits (10 sign-ins and 60 other /auth calls a minute) would stop them
  AUTH_CREDENTIAL_LIMIT: 1000
  AUTH_PERMIT_LIMIT: 1000

jobs:
  playwright:
    name: Playwright against docker compose
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: ./.github/actions/start-stack
      - name: Show the stack
        if: always()
        run: docker compose ps
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: UI/store-app.UI/.nvmrc
          cache: npm
          cache-dependency-path: UI/store-app.UI/package-lock.json
      - run: npm ci
        working-directory: UI/store-app.UI
      - run: npx playwright install --with-deps chromium
        working-directory: UI/store-app.UI
      - name: Run the scenarios
        working-directory: UI/store-app.UI
        env:
          E2E_BASE_URL: http://localhost:8081
          E2E_ADMIN_PASSWORD: ${{ env.TRUE_ADMIN_PASSWORD }}
        run: npx playwright test
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: UI/store-app.UI/playwright-report
          retention-days: 14
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  lighthouse:
    name: Lighthouse budget against docker compose
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: ./.github/actions/start-stack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: UI/store-app.UI/.nvmrc
      - name: Run Lighthouse CI
        working-directory: UI/store-app.UI
        # The runner's Chrome; a product page of this database (the ids differ between databases)
        run: |
          export LHCI_PRODUCT_PATH="/products/$(curl -fsS 'http://localhost:8081/api/v1/products?pageSize=1' | jq '.items[0].id')"
          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: UI/store-app.UI/lighthouse-report
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
