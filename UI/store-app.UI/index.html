<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)" />
    <!-- The shop's title, description and social card until the app writes the page's own
         (src/seo); crawlers that do not run the app see these. nginx writes the shop's public
         address into the picture's one as it serves the page (docker/16-shop-url.envsh). -->
    <title>Store — furniture &amp; home</title>
    <meta name="description" content="Furniture and home goods for every room, delivered to your door." />
    <meta property="og:site_name" content="Store" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Store — furniture &amp; home" />
    <meta property="og:description" content="Furniture and home goods for every room, delivered to your door." />
    <meta property="og:image" content="%SHOP_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A cream sofa in a sunlit living room, with the words Store feels like home" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
