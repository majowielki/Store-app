# The whole store, the way it runs in production: Production environment, no port of the
# infrastructure on the host, no default password, every service limited in CPU and memory,
# and no service waiting for another service - only for its database and the broker. Each
# service's migrations run first as a one-shot container of the same image (--migrate), so the
# service itself refuses to start against a schema it does not know.
#
#   docker compose up --build                         prod-like, UI on http://localhost:8081
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#                                                     development: Development environment,
#                                                     demo accounts, host ports, Aspire dashboard
#   docker compose --profile tools -f ... up          plus pgAdmin (docker-compose.tools.yml)
#
# Secrets come from .env (see .env.example); compose refuses to start without them.

name: store

x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 512M

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  JwtSettings__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required - set it in .env, see .env.example}
  JwtSettings__Issuer: Store.API
  JwtSettings__Audience: Store.Client
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Port: 5672
  RabbitMQ__VirtualHost: /
  RabbitMQ__Username: ${RABBITMQ_USER:-store_user}
  RabbitMQ__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required - set it in .env, see .env.example}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-identity-env: &identity-env
  <<: *service-env
  ConnectionStrings__DefaultConnection: "Host=postgres;Database=store_identity_db;Username=${POSTGRES_USER:-store_user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env, see .env.example};Port=5432"
  TrueAdmin__Email: ${TRUE_ADMIN_EMAIL:-trueadmin@store.com}
  TrueAdmin__Password: ${TRUE_ADMIN_PASSWORD:?TRUE_ADMIN_PASSWORD is required - set it in .env, see .env.example}
  # The showcase accounts and the password-less demo logins; off unless a deployment wants them
  Demo__Enabled: ${DEMO_ENABLED:-false}

x-product-env: &product-env
  <<: *service-env
  ConnectionStrings__DefaultConnection: "Host=postgres;Database=store_product_db;Username=${POSTGRES_USER:-store_user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env, see .env.example};Port=5432"
  InternalApi__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required - set it in .env, see .env.example}

x-cart-env: &cart-env
  <<: *service-env
  ConnectionStrings__DefaultConnection: "Host=postgres;Database=store_cart_db;Username=${POSTGRES_USER:-store_user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env, see .env.example};Port=5432"
  InternalApi__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required - set it in .env, see .env.example}
  Services__ProductService: http://productservice:8080

x-order-env: &order-env
  <<: *service-env
  ConnectionStrings__DefaultConnection: "Host=postgres;Database=store_order_db;Username=${POSTGRES_USER:-store_user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env, see .env.example};Port=5432"
  InternalApi__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required - set it in .env, see .env.example}
  Services__ProductService: http://productservice:8080
  Services__CartService: http://cartservice:8080

x-audit-env: &audit-env
  <<: *service-env
  ConnectionStrings__DefaultConnection: "Host=postgres;Database=store_audit_db;Username=${POSTGRES_USER:-store_user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env, see .env.example};Port=5432"

x-infrastructure-ready: &infrastructure-ready
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: store_db
      POSTGRES_USER: ${POSTGRES_USER:-store_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env, see .env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Infrastructure/scripts/init-databases.sql:/docker-entrypoint-initdb.d/02-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-store_user} -d store_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - store

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-store_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required - set it in .env, see .env.example}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - store

  # --- identity ------------------------------------------------------------------------------
  identity-migrate:
    image: store/identity
    environment: *identity-env
    command: ["--migrate"]
    restart: "no"
    depends_on: *infrastructure-ready
    networks:
      - store

  identityservice:
    build:
      context: .
      dockerfile: Services/IdentityService/Dockerfile
    image: store/identity
    <<: *limits
    restart: unless-stopped
    environment: *identity-env
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    networks:
      - store

  # --- catalogue -----------------------------------------------------------------------------
  product-migrate:
    image: store/product
    environment: *product-env
    command: ["--migrate"]
    restart: "no"
    depends_on: *infrastructure-ready
    networks:
      - store

  productservice:
    build:
      context: .
      dockerfile: Services/ProductService/Dockerfile
    image: store/product
    <<: *limits
    restart: unless-stopped
    environment: *product-env
    depends_on:
      product-migrate:
        condition: service_completed_successfully
    networks:
      - store

  # --- cart ----------------------------------------------------------------------------------
  cart-migrate:
    image: store/cart
    environment: *cart-env
    command: ["--migrate"]
    restart: "no"
    depends_on: *infrastructure-ready
    networks:
      - store

  cartservice:
    build:
      context: .
      dockerfile: Services/CartService/Dockerfile
    image: store/cart
    <<: *limits
    restart: unless-stopped
    environment: *cart-env
    depends_on:
      cart-migrate:
        condition: service_completed_successfully
    networks:
      - store

  # --- orders --------------------------------------------------------------------------------
  order-migrate:
    image: store/order
    environment: *order-env
    command: ["--migrate"]
    restart: "no"
    depends_on: *infrastructure-ready
    networks:
      - store

  orderservice:
    build:
      context: .
      dockerfile: Services/OrderService/Dockerfile
    image: store/order
    <<: *limits
    restart: unless-stopped
    environment: *order-env
    depends_on:
      order-migrate:
        condition: service_completed_successfully
    networks:
      - store

  # --- audit ---------------------------------------------------------------------------------
  audit-migrate:
    image: store/audit
    environment: *audit-env
    command: ["--migrate"]
    restart: "no"
    depends_on: *infrastructure-ready
    networks:
      - store

  auditlogservice:
    build:
      context: .
      dockerfile: Services/AuditLogService/Dockerfile
    image: store/audit
    <<: *limits
    restart: unless-stopped
    environment: *audit-env
    depends_on:
      audit-migrate:
        condition: service_completed_successfully
    networks:
      - store

  # --- gateway and UI ------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Gateway/APIGateway/Dockerfile
    image: store/gateway
    <<: *limits
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required - set it in .env, see .env.example}
      JwtSettings__Issuer: Store.API
      JwtSettings__Audience: Store.Client
      # Where the routes go inside this network; the image carries no addresses of its own
      ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address: http://identityservice:8080/
      ReverseProxy__Clusters__products-cluster__Destinations__destination1__Address: http://productservice:8080/
      ReverseProxy__Clusters__cart-cluster__Destinations__destination1__Address: http://cartservice:8080/
      ReverseProxy__Clusters__orders-cluster__Destinations__destination1__Address: http://orderservice:8080/
      ReverseProxy__Clusters__audit-cluster__Destinations__destination1__Address: http://auditlogservice:8080/
      # Sign-ins per minute per client; the end-to-end tests raise it, every scenario signs in on its own
      RateLimiting__Auth__CredentialPermitLimit: ${AUTH_CREDENTIAL_LIMIT:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # The services are not dependencies: the gateway starts, probes them and routes to the
    # ones that answer
    networks:
      - store

  ui:
    build:
      context: ./UI/store-app.UI
      dockerfile: Dockerfile
    image: store/ui
    <<: *limits
    restart: unless-stopped
    environment:
      # The SPA calls /api on its own origin; nginx proxies it to the gateway
      GATEWAY_UPSTREAM: http://gateway:8080
      API_BASE_URL: /api/v1
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    networks:
      - store

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  store:
